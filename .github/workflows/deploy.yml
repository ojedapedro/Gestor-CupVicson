name: CI/CD → Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Build & TypeCheck
  # ──────────────────────────────────────────
  build:
    name: Build & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de producción
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Guardar artefactos de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 1

  # ──────────────────────────────────────────
  # JOB 2: Deploy a Vercel (solo en main)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy → Vercel
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'

# ──────────────────────────────────────────
# SECRETS requeridos en GitHub → Settings → Secrets:
#
#   VITE_SUPABASE_URL       → URL del proyecto Supabase
#   VITE_SUPABASE_ANON_KEY  → Anon key pública de Supabase
#   VERCEL_TOKEN            → Token de Vercel (vercel.com/account/tokens)
#   VERCEL_ORG_ID           → ID de la organización en Vercel
#   VERCEL_PROJECT_ID       → ID del proyecto en Vercel
# ──────────────────────────────────────────
